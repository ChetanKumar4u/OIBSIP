<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, keyboard-friendly four-function calculator.">
  <title>Orbit Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="calculator.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="calculator" aria-labelledby="page-title">
      <header class="heading">
        <a class="brand" href="#" aria-label="Orbit Calculator home"><span class="brand-mark">o</span> orbit</a>
        <p>LEVEL 02 · TASK 01</p>
      </header>
      <h1 id="page-title">Good numbers.<br><span>Clear thinking.</span></h1>
      <div class="display-panel">
        <p class="display-label">EXPRESSION</p>
        <output id="display" class="display" aria-label="Calculator display" aria-live="polite">0</output>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>
      <div class="keypad" role="group" aria-label="Calculator keypad">
        <button class="key utility" type="button" data-action="clear" aria-label="Clear all">C</button>
        <button class="key utility" type="button" data-action="backspace" aria-label="Delete last character">⌫</button>
        <button class="key operator" type="button" data-operator="/" aria-label="Divide">÷</button>
        <button class="key operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>
        <button class="key operator" type="button" data-operator="-">−</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>
        <button class="key operator" type="button" data-operator="+">+</button>

        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>
        <button class="key equals" type="button" data-action="equals" aria-label="Equals">=</button>

        <button class="key zero" type="button" data-digit="0">0</button>
        <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
      </div>
      <p class="hint">Use your keyboard or tap the keys.</p>
    </section>
  </main>
</body>
</html>
