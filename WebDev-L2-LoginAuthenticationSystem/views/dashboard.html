<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your protected Fieldnote demo workspace.">
  <title>Your space — Fieldnote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <a class="brand" href="/">fieldnote<span>.</span></a>
      <button id="logout-button" class="logout-button" type="button">Sign out</button>
    </header>
    <section class="welcome-card" aria-labelledby="welcome-title">
      <p class="eyebrow">YOUR PRIVATE SPACE</p>
      <h1 id="welcome-title">Welcome in, <span id="username">there</span>.</h1>
      <p>You reached this page through an active server-side session.</p>
      <div class="session-note"><span class="session-dot"></span> Session active <span id="session-email"></span></div>
    </section>
    <p id="dashboard-message" class="form-message" role="status" aria-live="polite"></p>
    <footer class="dashboard-footer">Fieldnote authentication demo · Level 2</footer>
  </main>
</body>
</html>
